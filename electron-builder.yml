appId: id.bangtutorial.bangstory
productName: Bang Story
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!node_modules/ffmpeg-static/{README.md,example.js,install.js,ffmpeg.exe.README}'
extraResources:
  - from: resources/fonts
    to: fonts
  - from: resources/licenses
    to: licenses
asarUnpack:
  - node_modules/ffmpeg-static/**
  - '**/*.node'
win:
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: node_modules/ffmpeg-static/ffmpeg.exe.LICENSE
      to: licenses/FFmpeg-LICENSE.txt
    - from: resources/whisper
      to: whisper
  artifactName: BangStory-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Bang Story
mac:
  target:
    - target: dmg
      arch: [x64]
  category: public.app-category.video
  identity: null
  extraResources:
    - from: node_modules/ffmpeg-static/ffmpeg.LICENSE
      to: licenses/FFmpeg-LICENSE.txt
  artifactName: BangStory-${version}-mac-${arch}.${ext}
npmRebuild: true
